name: Bug report
description: Report a reproducible forge problem
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction commands.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include commit, OS, Python/.NET and relevant game/loader versions. Redact personal paths and credentials. Do not upload game DLLs.
    validations:
      required: true

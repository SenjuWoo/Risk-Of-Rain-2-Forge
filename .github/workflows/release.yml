name: Release verification
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tagged:
    name: Tagged release gate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Tagged releases must prove VERSION, package version, changelog heading and the tag all agree.
      # A missing tag, malformed tag or missing changelog fails here rather than shipping silently.
      - name: Release gate (release mode)
        run: python forge.py release-check --mode release

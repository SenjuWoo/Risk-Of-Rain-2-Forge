name: Published release verification
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  checks: read   # release-check reads this commit's check runs as independent CI evidence
jobs:
  published:
    name: Download and verify published assets
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed through the environment, never interpolated into the script: a tag name is outside input.
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Download the published files
        run: gh release download "$env:RELEASE_TAG" --dir published
      # The point of this job: verify the bytes users actually download, not a claim in the repository.
      # --require-verified makes "CI evidence unknown" a failure; without it this job passed while
      # reporting release_verified: false, because the lookup had no token.
      - name: Verify published bytes and independent CI evidence
        run: python forge.py release-check --mode release --assets published --require-verified

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows tests and mod builds
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned local tools
        run: python forge.py setup
      - name: Run tests, including real MCP transport
        run: .venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Build and package both templates
        run: .venv/Scripts/python.exe scripts/ci_smoke.py
      - name: Check Windows launcher
        run: |
          .\forge.cmd --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\forge.cmd guide overview
          exit $LASTEXITCODE
